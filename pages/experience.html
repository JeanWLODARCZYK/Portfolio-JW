<title>Portfolio - Experiences</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f7f5;
    color:#123524;
}

/* ===== HEADER ===== */

header{
    background:#123524;
    color:white;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 3px 10px rgba(0,0,0,.2);
}

.logo{
    font-size:28px;
    font-weight:bold;
    letter-spacing:1px;
    line-height:1;
}

nav ul{
    list-style:none;
    align-items:center;
    display:flex;
    gap:30px;
}

nav li{
    position:relative;
    padding-bottom:25px;
    align-items:center;
}

nav a{
    text-decoration:none;
    color:white;
    font-weight:bold;
    padding:10px;
    transition:.3s;
    height:70px;   
    align-items:center;
}

nav a:hover{
    color:#9FD3A8;
}

/* ===== MENU DEROULANT ===== */

.dropdown{
    display:none;
    position:absolute;
    top:40px;
    left:0;
    background:white;
    min-width:180px;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.2);
}

.dropdown a{
    display:block;
    color:#123524;
    padding:12px 16px;
    align-items:center;
}

.dropdown a:hover{
    background:#e9f5eb;
    color:#123524;
}

nav li:hover .dropdown{
    display:block;
    align-items:center;
}

/* ===== HERO ===== */

.hero{
    height:85vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:30px;
}

.hero h1{
    font-size:60px;
    margin-bottom:20px;
    color:#123524;
}

.hero p{
    max-width:700px;
    font-size:20px;
    color:#3d5c4a;
    line-height:1.6;
    margin-bottom:40px;
}

.button{
    text-decoration:none;
    background:#123524;
    color:white;
    padding:15px 35px;
    border-radius:40px;
    transition:.3s;
    font-weight:bold;
}

.button:hover{
    background:#1f5b3d;
    transform:translateY(-3px);
}

/* ===== FOOTER ===== */

footer{
    background:#123524;
    color:white;
    text-align:center;
    padding:20px;
}

/* ===== RESPONSIVE ===== */

@media(max-width:768px){

header{
    flex-direction:column;
    gap:15px;
}

nav ul{
    flex-direction:column;
    align-items:center;
    gap:10px;
}

.dropdown{
    position:static;
    display:none;
    width:100%;
}

nav li:hover .dropdown{
    display:block;
}

.hero h1{
    font-size:40px;
}

.hero h2{
    font-size:35px;
}

.hero p{
    font-size:18px;
}
}
/* ====== Grille ====== */

.grid-container{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.card{
    width: 30vh;
    text-align: center;
    aspect-ratio:1 / 1;
    position:relative;
    overflow:hidden;
    text-decoration:none;
    color:white;
}


/* ====== Image ====== */

.card img{

    position:absolute;
    inset:0;

    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;

    filter:grayscale(100%);
    transform:scale(1);

    transition:
        transform .4s ease,
        filter .4s ease;

}

/* ====== Couche colorée ====== */

.overlay{

    position:absolute;
    inset:0;

    background:#123524;
    opacity:.35;

    transition:.4s;

}

/* ====== Texte ====== */

.card h2{

    position:relative;

    color:white;

    font-size:30px;
    text-align: center;
    vertical-align: middle;
    object-position:center;
    letter-spacing:3px;
    width : 30vh;


    z-index:2;

}

/* ====== Hover ====== */

.card:hover img{

    filter:grayscale(0%);
    transform:scale(1.1);

}

.card:hover .overlay{

    opacity:0;

}

/* ====== Responsive ====== */

@media(max-width:900px){

.grid-container{

    grid-template-columns:1fr;

}

.card,
.card:visited,
.card:hover,
.card:active{
    text-decoration:none;
    color:white;
}

}

</style>
